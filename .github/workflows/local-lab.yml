# Self-hosted lab: deploy-ready, eval-auto soft, model pool, product levers, integration umbrella.
# Uses runner labels: self-hosted + pfy-mentat (machine: nimo).
name: local-lab

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Which lab slice to run"
        type: choice
        default: full
        options:
          - full
          - g1-only
          - eval-auto
          - inventory
          - product
          - integration
  # Push does not start the lab. Branch landings do not use this runner.
  # 02:15 America/Los_Angeles (UTC-8) = 10:15 UTC. The 120 minute job wall
  # ends at 12:15 UTC, before nightly-models at 12:30 UTC (04:30 PT).
  schedule:
    - cron: "15 10 * * *"

# One lab run at a time. cancel-in-progress is false so a second run waits
# instead of killing a model load. The same group name is on nightly-models.
# scripts/model_lock.sh is the host lock that serializes the model step
# across workflows and Make targets.
concurrency:
  group: pfy-local-model
  cancel-in-progress: false

jobs:
  lab:
    name: lab (${{ github.event.inputs.mode || 'auto' }})
    runs-on: [self-hosted, Linux, X64, pfy-mentat]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Host fingerprint
        run: |
          set -euo pipefail
          echo "host=$(hostname)"
          echo "python=$(python3 --version 2>&1)"
          echo "ollama=$(curl -sf --max-time 2 http://127.0.0.1:11434/api/tags >/dev/null && echo up || echo down)"
          command -v docker >/dev/null && docker version --format 'docker={{.Server.Version}}' || echo "docker=absent"
          free -h 2>/dev/null | head -2 || true
          df -h . | tail -1 || true

      - name: G0 structural
        timeout-minutes: 30
        run: |
          python3 examples/eval-harness/run_structural.py --write-md pipelines/eval/structural.latest.md
          python3 examples/eval-harness/run_golden.py --write-md pipelines/eval/golden.latest.md

      - name: Catalog dashboard + pool inventory
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.mode == 'full' || github.event.inputs.mode == 'inventory' }}
        run: |
          python3 scripts/catalog_dashboard.py
          python3 scripts/model_pool_inventory.py
          python3 scripts/worker_brief_refresh.py || true

      - name: G1 deploy-ready (soft smokes)
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.mode == 'full' || github.event.inputs.mode == 'g1-only' }}
        timeout-minutes: 30
        run: |
          chmod +x scripts/eval-deploy-ready.sh
          ./scripts/eval-deploy-ready.sh

      - name: Product levers smoke
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.mode == 'full' || github.event.inputs.mode == 'product' }}
        timeout-minutes: 30
        run: |
          chmod +x scripts/smoke-product-levers.sh
          ./scripts/smoke-product-levers.sh

      - name: smoke-integration umbrella
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.mode == 'full' || github.event.inputs.mode == 'integration' }}
        timeout-minutes: 40
        run: |
          chmod +x scripts/smoke-integration.sh
          ./scripts/smoke-integration.sh

      - name: Preflight Ollama OpenAI path
        run: |
          if curl -sf --max-time 2 http://127.0.0.1:11434/v1/models >/dev/null; then
            echo "OPENAI_BASE_URL=http://127.0.0.1:11434/v1" >> "$GITHUB_ENV"
          elif curl -sf --max-time 2 http://127.0.0.1:11435/v1/models >/dev/null; then
            echo "OPENAI_BASE_URL=http://127.0.0.1:11435/v1" >> "$GITHUB_ENV"
          else
            echo "OPENAI_BASE_URL=http://127.0.0.1:11434/v1" >> "$GITHUB_ENV"
          fi

      - name: eval-auto (Ollama when present)
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.mode == 'full' || github.event.inputs.mode == 'eval-auto' }}
        continue-on-error: true
        timeout-minutes: 20
        env:
          EVAL_AUTO_REQUIRE_OLLAMA: "0"
          EVAL_GATE_CANDIDATES: "deepseek-coder:6.7b-instruct,deepseek-coder:6.7b,qwen2.5-coder:7b-instruct"
        run: |
          chmod +x scripts/eval-auto.sh scripts/model_lock.sh
          set +e
          ./scripts/model_lock.sh ./scripts/eval-auto.sh
          rc=$?
          set -e
          mkdir -p pipelines/eval
          echo "eval-auto_exit=$rc $(date -u +%Y-%m-%dT%H:%MZ)" >> pipelines/eval/eval-auto.latest.md
          # Always soft-ok so implement-lane quality is observational for this workflow
          exit 0

      - name: Upload lab receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: local-lab-${{ github.run_id }}
          path: |
            pipelines/eval/**
            pipelines/catalog/**
            pipelines/smoke/**
            pipelines/ops/**
          if-no-files-found: ignore
