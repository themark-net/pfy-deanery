# G0 gates — no LLM required. Runs on GitHub-hosted AND self-hosted (nimo) when online.
name: eval-structural

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  structural-github:
    # The image is pinned: ubuntu-latest moved to 26.04 (run 41000777422 on
    # catalog/x-intake-149), where bwrap works and rg is missing, so 40 harness2
    # sandbox tests failed. main has no required status checks, so the job name
    # follows the image.
    name: G0 (ubuntu-24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML for the workflow image pin
        run: |
          set -euo pipefail
          # setup-python's interpreter does not ship PyYAML. Install into the
          # same absolute PATH python3 the next step runs. Do not apt-install:
          # that package would not be on this interpreter.
          pin_py="$(command -v python3)"
          test -n "$pin_py"
          "$pin_py" -m pip install --disable-pip-version-check -q pyyaml
      - name: Workflow image pin
        run: |
          set -euo pipefail
          # Explicit interpreter: absolute PATH python3, symlinks left intact.
          # A missing PyYAML fails this step and names that path.
          pin_py="$(command -v python3)"
          test -n "$pin_py"
          "$pin_py" scripts/check_workflow_image_pin.py .github/workflows
      - name: Install ripgrep (harness2 sandbox tests need rg)
        run: |
          set -euo pipefail
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ripgrep
          fi
          rg --version | head -1
      - name: Structural + golden
        run: |
          python3 examples/eval-harness/run_structural.py --write-md pipelines/eval/structural.latest.md
          python3 examples/eval-harness/run_golden.py --write-md pipelines/eval/golden.latest.md
      - name: Gab #228 offline selftest
        if: always() && !cancelled()
        run: |
          set -euo pipefail
          PFY_GAB_OFFLINE=1 python3 scripts/pfy_gab_228.py --selftest
      - name: Jev #230 offline selftest
        if: always() && !cancelled()
        run: |
          set -euo pipefail
          PFY_JEV_OFFLINE=1 python3 scripts/pfy_jev_230.py --selftest
          python3 scripts/pfy_launch_wizard_225.py --selftest
      - name: pfylib toolset x harness + hedge (ADR-0017; offline unit tests)
        if: always() && !cancelled()
        run: |
          set -euo pipefail
          export PFY_STATE_DIR="$RUNNER_TEMP/pfy-state"
          python3 -m unittest discover -s tests -t .
          python3 scripts/catalog_check.py
          ./pfy toolset matrix
          ./pfy toolset plan jev --harness opencode
          ./pfy hedge decide --task bulk --local ready --budget 0
      - name: Launcher must exec
        if: always() && !cancelled()
        run: |
          set -euo pipefail
          git ls-files -s -- pfy scripts/pfy
          test -x pfy
          test -x scripts/pfy
          bash -n scripts/pfy
          python3 -m py_compile scripts/pfy-board.py scripts/pfy-gui.py
          ./pfy help
      - name: No encoded payloads / sharded source
        if: always() && !cancelled()
        run: |
          set -euo pipefail
          python3 scripts/check_no_encoded_payloads.py --selftest
          python3 scripts/check_no_encoded_payloads.py
      - name: Real-tree audits with full history (dogfood2 trailers, S1 patch-ids)
        if: always() && !cancelled()
        run: |
          set -euo pipefail
          # The checkout is fetch-depth 1, so the discover above skips the
          # dogfood2 real-tree audit and never lists the reworded commits.
          # Unshallow here, last, so the earlier steps are unchanged.
          git fetch --no-tags --quiet --unshallow origin
          test "$(git rev-parse --is-shallow-repository)" = false
          log="$RUNNER_TEMP/real-tree-audits.log"
          python3 -m unittest -v tests.test_dogfood2_1031_report tests.test_selfhost_1031_log 2>&1 | tee "$log"
          if grep -q "skipped" "$log"; then
            echo "real-tree audit skipped with full history"
            exit 1
          fi
          grep -q "test_real_tree_matches_receipts_and_trailers .* ok$" "$log"
          grep -q "test_this_branch_has_no_bad_built_by_trailer .* ok$" "$log"
      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g0-github-${{ github.run_id }}
          path: |
            pipelines/eval/structural.latest.md
            pipelines/eval/golden.latest.md
          if-no-files-found: ignore

  structural-local:
    name: G0 (self-hosted nimo)
    runs-on: [self-hosted, Linux, X64, pfy-mentat]
    # Don't block PR merge if lab machine is offline
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Structural + golden
        run: |
          set -euo pipefail
          python3 examples/eval-harness/run_structural.py --write-md pipelines/eval/structural.latest.md
          python3 examples/eval-harness/run_golden.py --write-md pipelines/eval/golden.latest.md
      - name: Launcher must exec
        if: always() && !cancelled()
        run: |
          set -euo pipefail
          git ls-files -s -- pfy scripts/pfy
          test -x pfy
          test -x scripts/pfy
          bash -n scripts/pfy
          python3 scripts/check_no_encoded_payloads.py
          ./pfy help
      - name: Jev #230 CUA-S1-FORMS smoke (nimo, no Mark)
        if: always() && !cancelled()
        run: |
          set -euo pipefail
          PFY_JEV_OFFLINE=1 python3 scripts/pfy_jev_230.py --selftest
          PFY_JEV_OFFLINE=1 python3 scripts/pfy_jev_230.py --smoke cua-s1-forms
      - name: Catalog receipts
        # Separate step so a red dashboard/check cannot skip ./pfy. Do not fake-pass.
        # catalog_check also enforces the tools.json <-> toolsets.json link (ADR-0017).
        if: always() && !cancelled()
        run: |
          set -euo pipefail
          python3 scripts/catalog_dashboard.py
          python3 scripts/catalog_check.py
          python3 scripts/smoke_contract_lint.py
          PFY_STATE_DIR="$RUNNER_TEMP/pfy-state" python3 -m unittest discover -s tests -t .
      - name: Upload local receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g0-local-${{ github.run_id }}
          path: |
            pipelines/eval/*.md
            pipelines/catalog/*.md
          if-no-files-found: ignore
