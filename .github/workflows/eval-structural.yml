# G0 gates — no LLM required.
# Branch landings and workflow_dispatch use the GitHub-hosted ubuntu job only.
# The self-hosted nimo job runs on push to main or master, and on the schedule.
# Nimo evidence for a branch landing is the pregate cache, not this runner.
name: eval-structural

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  schedule:
    # 07:00 America/Los_Angeles (UTC-8). After nightly-models' 120 minute wall,
    # which starts at 04:30 PT (12:30 UTC) and ends by 06:30 PT.
    - cron: "0 15 * * *"

# Cancel a superseded run on a branch or PR. Do not cancel main or master.
concurrency:
  group: eval-structural-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

jobs:
  structural-github:
    # The image is pinned: ubuntu-latest moved to 26.04 (run 41000777422 on
    # catalog/x-intake-149), where bwrap works and rg is missing, so 40 harness2
    # sandbox tests failed. main has no required status checks, so the job name
    # follows the image.
    name: G0 (ubuntu-24.04)
    runs-on: ubuntu-24.04
    # Full suite on this image is over 5 minutes. Four shards by module hash
    # run the same non-test checks and a quarter of the selected modules.
    strategy:
      fail-fast: false
      matrix:
        shard: ["0", "1", "2", "3"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML for the workflow image pin
        run: |
          set -euo pipefail
          # setup-python's interpreter ships neither PyYAML nor pytest (the real
          # pytest gate test needs it). Install into the
          # same absolute PATH python3 the next step runs. Do not apt-install:
          # that package would not be on this interpreter.
          pin_py="$(command -v python3)"
          test -n "$pin_py"
          "$pin_py" -m pip install --disable-pip-version-check -q pyyaml pytest
      - name: Workflow image pin
        run: |
          set -euo pipefail
          # Explicit interpreter: absolute PATH python3, symlinks left intact.
          # A missing PyYAML fails this step and names that path.
          pin_py="$(command -v python3)"
          test -n "$pin_py"
          "$pin_py" scripts/check_workflow_image_pin.py .github/workflows
      - name: Install ripgrep (harness2 sandbox tests need rg)
        run: |
          set -euo pipefail
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ripgrep
          fi
          rg --version | head -1
      - name: Structural + golden
        run: |
          python3 examples/eval-harness/run_structural.py --skip-unittests --write-md pipelines/eval/structural.latest.md
          python3 examples/eval-harness/run_golden.py --write-md pipelines/eval/golden.latest.md
      - name: Gab #228 offline selftest
        if: always() && !cancelled()
        run: |
          set -euo pipefail
          PFY_GAB_OFFLINE=1 python3 scripts/pfy_gab_228.py --selftest
      - name: Jev #230 offline selftest
        if: always() && !cancelled()
        run: |
          set -euo pipefail
          PFY_JEV_OFFLINE=1 python3 scripts/pfy_jev_230.py --selftest
          python3 scripts/pfy_launch_wizard_225.py --selftest
      - name: pfylib toolset x harness + hedge (ADR-0017; offline unit tests)
        if: always() && !cancelled()
        run: |
          set -euo pipefail
          export PFY_STATE_DIR="$RUNNER_TEMP/pfy-state"
          python3 scripts/catalog_check.py
          ./pfy toolset matrix
          ./pfy toolset plan jev --harness opencode
          ./pfy hedge decide --task bulk --local ready --budget 0
      - name: Tests (selected)
        if: always() && !cancelled()
        run: |
          set -euo pipefail
          # push to main uses github.event.before. PR and workflow_dispatch
          # use the merge-base with origin/main. The script fetches that history.
          # Ubuntu never reads the pregate cache. Each matrix cell is one shard.
          PFY_CI_EVENT="${{ github.event_name }}" \
          PFY_CI_REF="${{ github.ref }}" \
          PFY_CI_BEFORE="${{ github.event.before }}" \
          PFY_CI_SHARD="${{ matrix.shard }}" \
          PFY_CI_SHARDS=4 \
          PFY_CI_USE_CACHE=0 \
          bash scripts/ci_selected_tests.sh
      - name: Launcher must exec
        if: always() && !cancelled()
        run: |
          set -euo pipefail
          git ls-files -s -- pfy scripts/pfy
          test -x pfy
          test -x scripts/pfy
          bash -n scripts/pfy
          python3 -m py_compile scripts/pfy-board.py scripts/pfy-gui.py
          ./pfy help
      - name: No encoded payloads / sharded source
        if: always() && !cancelled()
        run: |
          set -euo pipefail
          python3 scripts/check_no_encoded_payloads.py --selftest
          python3 scripts/check_no_encoded_payloads.py
      - name: Real-tree audits with full history (dogfood2 trailers, S1 patch-ids)
        if: always() && !cancelled()
        run: |
          set -euo pipefail
          # Checkout is fetch-depth 1. The selected suite may not include
          # these two modules, and a shallow clone skips the real-tree audit.
          # Unshallow here when an earlier step has not already done it.
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch --no-tags --quiet --unshallow origin
          fi
          test "$(git rev-parse --is-shallow-repository)" = false
          log="$RUNNER_TEMP/real-tree-audits.log"
          python3 -m unittest -v tests.test_dogfood2_1031_report tests.test_selfhost_1031_log 2>&1 | tee "$log"
          if grep -q "skipped" "$log"; then
            echo "real-tree audit skipped with full history"
            exit 1
          fi
          grep -q "test_real_tree_matches_receipts_and_trailers .* ok$" "$log"
          grep -q "test_this_branch_has_no_bad_built_by_trailer .* ok$" "$log"
      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g0-github-${{ github.run_id }}-shard-${{ matrix.shard }}
          path: |
            pipelines/eval/structural.latest.md
            pipelines/eval/golden.latest.md
          if-no-files-found: ignore

  structural-local:
    name: G0 (self-hosted nimo)
    # Not a landing gate. Branch pull requests and workflow_dispatch stay on
    # the ubuntu job. A pregate cache hit is the nimo evidence for those.
    if: github.event_name == 'schedule' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
    runs-on: [self-hosted, Linux, X64, pfy-mentat]
    # Don't block main if the lab machine is offline
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Structural + golden
        run: |
          set -euo pipefail
          python3 examples/eval-harness/run_structural.py --skip-unittests --write-md pipelines/eval/structural.latest.md
          python3 examples/eval-harness/run_golden.py --write-md pipelines/eval/golden.latest.md
      - name: Launcher must exec
        if: always() && !cancelled()
        run: |
          set -euo pipefail
          git ls-files -s -- pfy scripts/pfy
          test -x pfy
          test -x scripts/pfy
          bash -n scripts/pfy
          python3 scripts/check_no_encoded_payloads.py
          ./pfy help
      - name: Jev #230 CUA-S1-FORMS smoke (nimo, no Mark)
        if: always() && !cancelled()
        run: |
          set -euo pipefail
          PFY_JEV_OFFLINE=1 python3 scripts/pfy_jev_230.py --selftest
          PFY_JEV_OFFLINE=1 python3 scripts/pfy_jev_230.py --smoke cua-s1-forms
      - name: Catalog receipts
        # Separate step so a red dashboard/check cannot skip ./pfy. Do not fake-pass.
        # catalog_check also enforces the tools.json <-> toolsets.json link (ADR-0017).
        if: always() && !cancelled()
        run: |
          set -euo pipefail
          python3 scripts/catalog_dashboard.py
          python3 scripts/catalog_check.py
          python3 scripts/smoke_contract_lint.py
      - name: Tests (selected)
        if: always() && !cancelled()
        run: |
          set -euo pipefail
          # Same selection as the ubuntu job. scripts/test_cache.py check runs
          # before the suite. A pregate PASS for this tree skips the suite.
          PFY_CI_EVENT="${{ github.event_name }}" \
          PFY_CI_REF="${{ github.ref }}" \
          PFY_CI_BEFORE="${{ github.event.before }}" \
          PFY_CI_USE_CACHE=1 \
          bash scripts/ci_selected_tests.sh
      - name: Upload local receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g0-local-${{ github.run_id }}
          path: |
            pipelines/eval/*.md
            pipelines/catalog/*.md
          if-no-files-found: ignore
